<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 아이디어 생성기</title>
    <meta name="description" content="장르·메커니즘·배경·주인공·목표·반전을 굴려 그럴듯한(가끔은 엉뚱한) 게임 아이디어를 한 줄로 뽑아 주는 랜덤 생성기.">
    <meta name="theme-color" content="#1e1e2f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f3f2f9" media="(prefers-color-scheme: light)">
    <meta property="og:type" content="website">
    <meta property="og:title" content="💡 랜덤 게임 아이디어 제네레이터">
    <meta property="og:description" content="버튼 한 번에 한 줄 게임 기획서! 분위기를 고르고, 마음에 드는 칸은 잠그고, 링크로 공유하세요.">
    <meta property="og:url" content="https://wordmaker-eight.vercel.app">
    <meta property="og:locale" content="ko_KR">
    <link rel="canonical" href="https://wordmaker-eight.vercel.app/">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23ff5252'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='20' cy='20' r='5.5'/%3E%3Ccircle cx='44' cy='20' r='5.5'/%3E%3Ccircle cx='32' cy='32' r='5.5'/%3E%3Ccircle cx='20' cy='44' r='5.5'/%3E%3Ccircle cx='44' cy='44' r='5.5'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        :root {
            color-scheme: dark;
            --bg: #1e1e2f;
            --card: #2a2a40;
            --card-2: #33334d;
            --border: #44445f;
            --text: #f4f4fa;
            --muted: #a9a9c2;
            --accent: #4dd0e1;
            --primary: #ff5252;
            --primary-hover: #ff1744;
            --focus: #ffd54f;
            --lock-bg: rgba(77, 208, 225, 0.12);
            --c-g: #4dd0e1;
            --c-m: #ffb74d;
            --c-s: #81c784;
            --c-p: #f48fb1;
            --c-o: #b39ddb;
            --c-t: #ff8a65;
            --c-a: #90caf9;
        }
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --bg: #f3f2f9;
                --card: #ffffff;
                --card-2: #f0eff8;
                --border: #d9d7e8;
                --text: #1f1f2e;
                --muted: #5e5d75;
                --accent: #00838f;
                --primary: #e53935;
                --primary-hover: #c62828;
                --focus: #6a4cff;
                --lock-bg: rgba(0, 131, 143, 0.10);
                --c-g: #00838f;
                --c-m: #b45309;
                --c-s: #2e7d32;
                --c-p: #ad1457;
                --c-o: #5e35b1;
                --c-t: #c2410c;
                --c-a: #1565c0;
            }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
            line-height: 1.5;
        }
        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 16px 56px;
        }
        header { text-align: center; margin-bottom: 20px; }
        h1 {
            color: var(--accent);
            font-size: clamp(22px, 5.5vw, 30px);
            margin: 0 0 6px;
            word-break: keep-all;
        }
        .sub { margin: 0; color: var(--muted); font-size: 15px; word-break: keep-all; }

        /* 옵션 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 16px;
            margin-bottom: 16px;
        }
        fieldset.moods {
            border: 0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        fieldset.moods legend {
            float: left;
            margin-right: 4px;
            color: var(--muted);
            font-size: 14px;
        }
        .chip { position: relative; display: inline-flex; cursor: pointer; }
        .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
        .chip span {
            display: inline-block;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            user-select: none;
            transition: background-color .15s, border-color .15s;
        }
        .chip:hover span { border-color: var(--accent); }
        .chip input:checked + span {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
            font-weight: 700;
        }
        .chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

        /* 결과 카드 */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        #pitch {
            margin: 0 0 20px;
            font-size: clamp(19px, 4.6vw, 24px);
            font-weight: 600;
            line-height: 1.6;
            word-break: keep-all;
            overflow-wrap: anywhere;
            min-height: 3.2em;
        }
        #pitch .w { font-weight: 800; }
        .w-g { color: var(--c-g); } .w-m { color: var(--c-m); } .w-s { color: var(--c-s); }
        .w-p { color: var(--c-p); } .w-o { color: var(--c-o); } .w-t { color: var(--c-t); } .w-a { color: var(--c-a); }
        .pop { animation: pop .28s ease-out; }
        @keyframes pop { from { opacity: .2; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        .slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
        .slot {
            display: grid;
            grid-template-columns: 8.5rem 1fr auto;
            align-items: center;
            gap: 4px 10px;
            padding: 8px 8px 8px 12px;
            border-radius: 10px;
            background: var(--card-2);
            border: 1px solid transparent;
        }
        .slot.locked { border-color: var(--accent); background: var(--lock-bg); }
        .slot-label { color: var(--muted); font-size: 14px; white-space: nowrap; }
        .slot-value { font-weight: 600; word-break: keep-all; overflow-wrap: anywhere; }
        .slot-btns { display: flex; gap: 4px; }

        button { font: inherit; }
        button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
        .icon {
            min-width: 40px;
            height: 40px;
            padding: 0 8px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
        }
        .icon:hover { border-color: var(--accent); }
        .icon[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }

        .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 20px; }
        .primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px 34px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color .2s, transform .1s;
        }
        .primary:hover { background: var(--primary-hover); }
        .primary:active { transform: scale(0.96); }
        .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .btn {
            min-height: 42px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
        }
        .btn:hover { border-color: var(--accent); }
        .btn[aria-pressed="true"] { border-color: var(--c-m); color: var(--c-m); font-weight: 700; }
        .hint { margin: 14px 0 0; text-align: center; color: var(--muted); font-size: 13px; word-break: keep-all; }
        kbd {
            font: inherit;
            font-size: 12px;
            padding: 1px 6px;
            border: 1px solid var(--border);
            border-bottom-width: 2px;
            border-radius: 5px;
            background: var(--card);
        }

        /* 기록 */
        .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
        .list-box { min-width: 0; }
        .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .list-head h2 { margin: 0; font-size: 16px; }
        .link-btn {
            border: 0;
            background: none;
            color: var(--muted);
            font-size: 13px;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: underline;
        }
        .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
        .items li { display: flex; gap: 6px; min-width: 0; }
        .item {
            flex: 1;
            min-width: 0;
            text-align: left;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            line-height: 1.45;
            cursor: pointer;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }
        .item-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .item:hover { border-color: var(--accent); }
        .items .icon { font-size: 14px; flex: none; }
        .empty { margin: 0; color: var(--muted); font-size: 14px; }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 20px);
            max-width: calc(100vw - 32px);
            padding: 10px 18px;
            border-radius: 999px;
            background: var(--text);
            color: var(--bg);
            font-size: 15px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            text-align: center;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (max-width: 520px) {
            .card { padding: 18px 14px; }
            .slot {
                grid-template-columns: 1fr auto;
                grid-template-areas: "label btns" "value value";
                padding: 8px 8px 10px 12px;
            }
            .slot-label { grid-area: label; }
            .slot-btns { grid-area: btns; }
            .slot-value { grid-area: value; }
            .lists { grid-template-columns: 1fr; }
            .controls { gap: 8px; }
            fieldset.moods { gap: 4px; justify-content: center; }
            .chip span { padding: 6px 10px; }
            .primary { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .pop { animation: none; }
            .primary, #toast { transition: none; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>💡 랜덤 게임 아이디어 제네레이터</h1>
        <p class="sub">장르·메커니즘·배경·주인공·목표·반전을 굴려서 한 줄 기획서를 뽑아 보세요.</p>
    </header>

    <main>
        <section class="controls" aria-label="생성 옵션">
            <fieldset class="moods">
                <legend>분위기</legend>
                <label class="chip"><input type="radio" name="mood" value="a" checked><span>전체</span></label>
                <label class="chip"><input type="radio" name="mood" value="j"><span>진지</span></label>
                <label class="chip"><input type="radio" name="mood" value="c"><span>코믹</span></label>
                <label class="chip"><input type="radio" name="mood" value="h"><span>호러</span></label>
                <label class="chip"><input type="radio" name="mood" value="z"><span>아늑</span></label>
            </fieldset>
            <label class="chip" title="궁합을 무시하고 아무거나 섞어요"><input type="checkbox" id="chaos"><span>🌀 완전 랜덤</span></label>
        </section>

        <section class="card" aria-label="생성된 아이디어">
            <p id="pitch" aria-live="polite" aria-atomic="true">새로운 프로젝트 아이디어를 뽑아보세요!</p>
            <ul class="slots" id="slots"></ul>
        </section>

        <div class="actions">
            <button type="button" id="roll" class="primary">아이디어 굴리기 🎲</button>
            <div class="row">
                <button type="button" id="copy" class="btn">📋 복사</button>
                <button type="button" id="share" class="btn">🔗 공유</button>
                <button type="button" id="fav" class="btn" aria-pressed="false">☆ 즐겨찾기</button>
            </div>
        </div>
        <p class="hint"><kbd>Space</kbd> / <kbd>Enter</kbd>로도 굴릴 수 있어요 · 🔒 잠근 칸은 그대로 남아요</p>

        <section class="lists">
            <div class="list-box">
                <div class="list-head">
                    <h2>🕘 최근 아이디어</h2>
                    <button type="button" class="link-btn" id="clear-history">비우기</button>
                </div>
                <ol class="items" id="history"></ol>
                <p class="empty" id="history-empty">아직 굴린 아이디어가 없어요.</p>
            </div>
            <div class="list-box">
                <div class="list-head"><h2>⭐ 즐겨찾기</h2></div>
                <ul class="items" id="favs"></ul>
                <p class="empty" id="favs-empty">마음에 드는 아이디어에 ☆를 눌러 보관하세요.</p>
            </div>
        </section>
    </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

        '{g:와/과} {m} 시스템의 만남. {p:은/는} {s}에서 눈을 뜨고, {o}에 나선다. {t}.'
    ];
    const PREFIX = {
        r: ['단, ', '하지만 ', '제약: '],
        v: ['그런데 알고 보니 ', '반전: ', '충격 반전 — ']
    };
    const PREFIX_COUNT = 3;

    /* =====================================================================
     * 한국어 조사 (받침 판별)
     * finalSound(): 0 = 받침 없음, 1 = 받침 있음, 2 = ㄹ 받침
     * ===================================================================== */
    const JOSA = {
        '은/는': ['은', '는'],
        '이/가': ['이', '가'],
        '을/를': ['을', '를'],
        '와/과': ['과', '와'],
        '으로/로': ['으로', '로']
    };
    // 숫자 끝자리 읽기: 영 일 이 삼 사 오 육 칠 팔 구 (10, 100 등은 '십/백/천/만'이라 모두 받침 → 0과 같은 값)
    const DIGIT_SOUND = { 0: 1, 1: 2, 2: 0, 3: 1, 4: 0, 5: 0, 6: 1, 7: 2, 8: 2, 9: 0 };
    // 알파벳 이름 읽기: 엘(L) 엠(M) 엔(N) 알(R)만 받침이 있음
    const LETTER_SOUND = { L: 2, M: 1, N: 1, R: 2 };

    function finalSound(word) {
        let w = String(word == null ? '' : word).trim();
        w = w.replace(/\s*\([^()]*\)\s*$/, '');            // "체력(HP)" → "체력"
        w = w.replace(/[^0-9A-Za-z가-힣]+$/, '');  // 끝의 따옴표·문장부호 무시
        if (!w) return 0;
        const ch = w[w.length - 1];
        const code = ch.charCodeAt(0);
        if (code >= 0xAC00 && code <= 0xD7A3) {
            const jong = (code - 0xAC00) % 28;
            return jong === 0 ? 0 : (jong === 8 ? 2 : 1);
        }
        if (ch >= '0' && ch <= '9') return DIGIT_SOUND[ch];
        const run = (w.match(/[A-Za-z]+$/) || [''])[0];
        if (run) {
            // 대문자 약어(RPG, VR, FPS)나 한 글자는 알파벳 이름으로 읽음
            if (run.length === 1 || run === run.toUpperCase()) {
                return LETTER_SOUND[run[run.length - 1].toUpperCase()] || 0;
            }
            // 일반 영단어는 대략적인 발음 규칙으로 추정
            const low = run.toLowerCase();
            if (/(ng|m|n|[mn]e)$/.test(low)) return 1;   // Steam, game, line
            if (/(l|[aeiou]le)$/.test(low)) return 2;    // pixel, role
            if (/(ck|t|p)$/.test(low)) return 1;          // back, robot, chip
            return 0;                                     // apple, zelda, puzzle
        }
        return 0;
    }
    function josa(word, pair) {
        const forms = JOSA[pair];
        if (!forms) return pair;
        const s = finalSound(word);
        if (pair === '으로/로') return s === 1 ? forms[0] : forms[1];
        return s ? forms[0] : forms[1];
    }

    /* =====================================================================
     * 난수: crypto.getRandomValues + 거절 표본추출(편향 없는 정수)
     * ===================================================================== */
    const hasCrypto = typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function';
    const rbuf = new Uint32Array(64);
    let rpos = rbuf.length;
    function rand32() {
        if (!hasCrypto) return Math.floor(Math.random() * 4294967296);
        if (rpos >= rbuf.length) { crypto.getRandomValues(rbuf); rpos = 0; }
        return rbuf[rpos++];
    }
    function randInt(n) {
        n = Math.floor(n);
        if (!(n >= 1) || n > 4294967296) throw new RangeError('randInt: bad n ' + n);
        if (n === 1) return 0;
        const limit = 4294967296 - (4294967296 % n);
        let x;
        do { x = rand32(); } while (x >= limit);
        return x % n;
    }

    /* =====================================================================
     * 궁합: 태그가 겹치면 가중치↑, 부딪치면↓, 확실히 말이 안 되는 쌍만 제외
     * ===================================================================== */
    const TONE_CLASH = new Set(['h:z', 'z:h', 'j:c', 'c:j']);
    const ERA_FAR = new Set(['s:y', 'y:s']);
    const PACE_FAR = new Set(['r:i', 'i:r']);
    // 분위기 필터: 고른 분위기와 충돌하는 태그'만' 가진 항목은 제외 (태그 없는 항목은 항상 허용)
    const MOOD_CONFLICT = { j: ['c'], c: ['j'], h: ['z', 'c'], z: ['h'] };
    const MOOD_NAMES = { a: '전체', j: '진지', c: '코믹', h: '호러', z: '아늑' };

    const crosses = (a, b, set) => a.some(x => b.some(y => set.has(x + ':' + y)));
    const overlaps = (a, b) => a.some(x => b.includes(x));
    function tagScore(a, b, farSet, near, far, other) {
        if (!a.length || !b.length) return 1;
        if (overlaps(a, b)) return near;
        return crosses(a, b, farSet) ? far : other;
    }
    function pairScore(e, c) {
        let s = tagScore(e.tone, c.tone, TONE_CLASH, 1.6, 0.35, 0.75);
        s *= tagScore(e.era, c.era, ERA_FAR, 1.6, 0.3, 0.6);
        if (e.pace && c.pace) s *= e.pace === c.pace ? 1.5 : (PACE_FAR.has(e.pace + ':' + c.pace) ? 0.3 : 0.6);
        return s;
    }

    // 명백히 말이 안 되는 조합 (양방향)
    const EXCLUDE_PAIRS = [
        ['m', 9, 'g', 12],   // 한 대만 맞아도 게임 오버인 방치형 클리커
        ['m', 50, 'g', 12],  // 물이 차오르기 전에 탈출해야 하는 방치형 클리커
        ['m', 43, 'g', 14],  // 실수할수록 음악이 빨라지는 비주얼 노벨
        ['m', 10, 'g', 14],  // 맵이 10초마다 바뀌는 비주얼 노벨
        ['m', 13, 'g', 5],   // 움직일 때만 시간이 흐르는 리듬 액션
        ['m', 54, 'g', 5],   // 접속 안 해도 돌아가는 리듬 액션
        ['m', 54, 'g', 22],  // … 레이싱
        ['m', 54, 'g', 23],  // … 대전 격투
        ['m', 40, 'g', 24],  // 아무도 죽이지 않는 배틀로얄
        ['m', 20, 't', 14],  // 두 캐릭터 동시 조작 + 두 플레이어가 한 몸
        ['m', 45, 't', 15],  // 말싸움으로 싸우는데 말을 못 함
        ['m', 11, 't', 1],   // 점프 불가인데 점프는 세 번
        ['m', 12, 't', 22],  // 무기를 빼앗아 싸우는데 공격 버튼 없음
        ['g', 34, 't', 22],  // 공격 버튼 없는 핵앤슬래시
        ['g', 37, 't', 8],   // 10분 만에 끝나는 MMORPG
        ['g', 26, 't', 8]    // 10분 만에 끝나는 4X
    ];
    const EXCL = new Set();
    EXCLUDE_PAIRS.forEach(([a, ia, b, ib]) => { EXCL.add(a + ia + '|' + b + ib); EXCL.add(b + ib + '|' + a + ia); });
    function isExcluded(slot, e, ctx) {
        for (const k in ctx) {
            const c = ctx[k];
            if (c && EXCL.has(slot + e.id + '|' + k + c.id)) return true;
        }
        return false;
    }
    function moodAllowed(e, mood) {
        if (!mood || mood === 'a' || !e.tone.length || e.tone.includes(mood)) return true;
        const bad = MOOD_CONFLICT[mood] || [];
        return !e.tone.some(t => bad.includes(t));
    }
    function weightOf(e, ctx, mood, chaos) {
        if (chaos) return 1;
        let lw = 0;
        for (const k in ctx) if (ctx[k]) lw += Math.log(pairScore(e, ctx[k]));
        let w = Math.exp(Math.max(-2.5, Math.min(2, lw)));   // 극단적인 쏠림 방지
        if (mood && mood !== 'a' && e.tone.includes(mood)) w *= 3;
        return w;
    }

    /* =====================================================================
     * 반복 방지: 슬롯마다 최근 K개(후보 수의 40%, 최대 20개)는 다시 뽑지 않음
     * ===================================================================== */
    const RECENT_MAX = 20;
    const recent = {};
    SLOT_KEYS.forEach(k => { recent[k] = []; });
    const stats = { fallbacks: 0 };
    const windowSize = n => Math.min(RECENT_MAX, Math.floor(n * 0.4));
    function remember(slot, id) {
        const r = recent[slot];
        r.push(id);
        if (r.length > RECENT_MAX) r.splice(0, r.length - RECENT_MAX);
    }
    function candidates(slot, mood) {
        const pool = DATA[slot].list;
        const c = pool.filter(e => moodAllowed(e, mood));
        return c.length ? c : pool.slice();
    }
    function pick(slot, ctx, opt) {
        const mood = opt.mood || 'a';
        const chaos = !!opt.chaos;
        const cands = candidates(slot, mood);
        const K = windowSize(cands.length);
        const recentIds = K ? recent[slot].slice(-K) : [];
        const ok = e => chaos || !isExcluded(slot, e, ctx);
        let pool = cands.filter(e => ok(e) && e.id !== opt.avoid && !recentIds.includes(e.id));
        if (!pool.length) {
            stats.fallbacks++;
            pool = cands.filter(e => ok(e) && e.id !== opt.avoid);
            if (!pool.length) pool = cands;
        }
        const ws = pool.map(e => Math.max(1, Math.round(weightOf(e, ctx, mood, chaos) * 1000)));
        let total = 0;
        ws.forEach(w => { total += w; });
        let r = randInt(total);
        for (let i = 0; i < pool.length; i++) {
            r -= ws[i];
            if (r < 0) { remember(slot, pool[i].id); return pool[i]; }
        }
        remember(slot, pool[pool.length - 1].id);
        return pool[pool.length - 1];
    }

    /* 아이디어 = { v: {슬롯: id}, tpl, pre, mood, chaos } */
    function generateIdea(prev, opt) {
        opt = opt || {};
        const locks = opt.locks || {};
        const v = {};
        const ctx = {};
        SLOT_KEYS.forEach(k => {
            if (locks[k] && prev && prev.v && entry(k, prev.v[k])) { v[k] = prev.v[k]; ctx[k] = entry(k, v[k]); }
        });
        SLOT_KEYS.forEach(k => {
            if (k in v) return;
            const e = pick(k, ctx, opt);
            v[k] = e.id;
            ctx[k] = e;
        });
        return { v, tpl: randInt(TEMPLATES.length), pre: randInt(PREFIX_COUNT), mood: opt.mood || 'a', chaos: !!opt.chaos };
    }
    function rerollSlot(prev, slot, opt) {
        opt = opt || {};
        const ctx = {};
        SLOT_KEYS.forEach(k => { if (k !== slot) ctx[k] = entry(k, prev.v[k]); });
        const e = pick(slot, ctx, Object.assign({}, opt, { avoid: prev.v[slot] }));
        const next = { v: Object.assign({}, prev.v), tpl: prev.tpl, pre: prev.pre, mood: opt.mood || 'a', chaos: !!opt.chaos };
        next.v[slot] = e.id;
        if (slot === 't') next.pre = randInt(PREFIX_COUNT);
        return next;
    }

    /* 문장 조립 → [{text, slot?}] */
    function composeParts(st) {
        const tpl = TEMPLATES[st.tpl] || TEMPLATES[0];
        const parts = [];
        const re = /\{([a-z])(?::([^}]+))?\}/g;
        let last = 0;
        let m;
        while ((m = re.exec(tpl))) {
            if (m.index > last) parts.push({ text: tpl.slice(last, m.index) });
            const k = m[1];
            const e = entry(k, st.v[k]);
            if (k === 't') {
                const list = PREFIX[e.kind === 'v' ? 'v' : 'r'];
                parts.push({ text: list[(st.pre || 0) % list.length] });
            }
            parts.push({ text: e.text, slot: k });
            if (m[2]) parts.push({ text: josa(e.text, m[2]) });
            last = re.lastIndex;
        }
        if (last < tpl.length) parts.push({ text: tpl.slice(last) });
        return parts;
    }
    const composeText = st => composeParts(st).map(p => p.text).join('');
    const fullText = st => composeText(st) + '\n🎨 아트 스타일: ' + entry('a', st.v.a).text;

    /* =====================================================================
     * 공유 링크: "#1.<g>.<m>.<s>.<p>.<o>.<t>.<a>.<문장틀>.<접두어>.<분위기>.<완전랜덤>"
     * 각 값은 고정 id(36진수). 앞의 "1"은 형식 버전.
     * ===================================================================== */
    const HASH_VERSION = '1';
    function encode(st) {
        return [HASH_VERSION]
            .concat(SLOT_KEYS.map(k => st.v[k].toString(36)))
            .concat([st.tpl, st.pre, st.mood || 'a', st.chaos ? 1 : 0])
            .join('.');
    }
    const ideaKey = code => String(code).split('.').slice(0, 1 + SLOT_KEYS.length + 2).join('.');
    // 잘못된 입력이면 null. 일부 칸만 깨졌으면 그 칸은 null로 두고 나머지를 살림.
    function decode(str) {
        try {
            const s = String(str == null ? '' : str).replace(/^#/, '').trim();
            if (!s || s.length > 120) return null;
            const parts = s.split('.');
            if (parts[0] !== HASH_VERSION) return null;
            const v = {};
            let valid = 0;
            SLOT_KEYS.forEach((k, i) => {
                const raw = parts[1 + i];
                const id = /^[0-9a-z]{1,4}$/.test(raw || '') ? parseInt(raw, 36) : NaN;
                if (entry(k, id)) { v[k] = id; valid++; } else v[k] = null;
            });
            if (!valid) return null;
            const n = 1 + SLOT_KEYS.length;
            const int = (x, max) => (/^\d{1,2}$/.test(x || '') && Number(x) < max ? Number(x) : null);
            const tpl = int(parts[n], TEMPLATES.length);
            const pre = int(parts[n + 1], PREFIX_COUNT);
            const mood = MOOD_NAMES[parts[n + 2]] ? parts[n + 2] : 'a';
            return { v, tpl, pre, mood, chaos: parts[n + 3] === '1', valid };
        } catch (e) {
            return null;
        }
    }
    // decode 결과의 빈 칸을 채워 완전한 아이디어로 만듦
    function completeIdea(d) {
        const locks = {};
        SLOT_KEYS.forEach(k => { locks[k] = d.v[k] != null; });
        const st = generateIdea({ v: d.v }, { locks, mood: d.mood, chaos: d.chaos });
        if (d.tpl != null) st.tpl = d.tpl;
        if (d.pre != null) st.pre = d.pre;
        SLOT_KEYS.forEach(k => { if (locks[k]) remember(k, st.v[k]); });
        return st;
    }

    /* 저장소 (사생활 보호 모드 등에서 실패해도 동작하도록) */
    function load(key, fallback) {
        try {
            const raw = window.localStorage.getItem(key);
            if (raw == null) return fallback;
            const val = JSON.parse(raw);
            return val == null ? fallback : val;
        } catch (e) {
            return fallback;
        }
    }
    function save(key, val) {
        try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 무시 */ }
    }
    const KEY_HISTORY = 'wordmaker.history.v1';
    const KEY_FAVS = 'wordmaker.favs.v1';
    const KEY_PREFS = 'wordmaker.prefs.v1';
    const HISTORY_MAX = 10;
    const FAVS_MAX = 50;
    const cleanCodes = arr => (Array.isArray(arr) ? arr : [])
        .filter(c => {
            if (typeof c !== 'string' || c.length > 120) return false;
            const d = decode(c);
            return !!d && d.valid === SLOT_KEYS.length;
        });

    /* =====================================================================
     * 화면
     * ===================================================================== */
    const $ = id => document.getElementById(id);
    const pitchEl = $('pitch');
    const slotsEl = $('slots');
    const chaosEl = $('chaos');
    const favBtn = $('fav');
    const toastEl = $('toast');
    let state = null;
    const locks = {};
    const slotEls = {};
    let historyList = cleanCodes(load(KEY_HISTORY, [])).slice(0, HISTORY_MAX);
    let favs = cleanCodes(load(KEY_FAVS, [])).slice(0, FAVS_MAX);

    function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }
    function currentMood() {
        const c = document.querySelector('input[name="mood"]:checked');
        return c && MOOD_NAMES[c.value] ? c.value : 'a';
    }
    function setMood(m) {
        const r = document.querySelector('input[name="mood"][value="' + (MOOD_NAMES[m] ? m : 'a') + '"]');
        if (r) r.checked = true;
    }
    function options() { return { mood: currentMood(), chaos: chaosEl.checked, locks }; }
    function savePrefs() { save(KEY_PREFS, { mood: currentMood(), chaos: chaosEl.checked }); }

    let toastTimer = 0;
    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function setLock(k, on) {
        locks[k] = !!on;
        const { li, lock } = slotEls[k];
        li.classList.toggle('locked', locks[k]);
        lock.setAttribute('aria-pressed', String(locks[k]));
        lock.textContent = locks[k] ? '🔒' : '🔓';
    }

    function buildSlots() {
        SLOTS.forEach(s => {
            const li = el('li', 'slot');
            li.dataset.slot = s.k;
            const label = el('span', 'slot-label', s.emoji + ' ' + s.name);
            const value = el('span', 'slot-value w-' + s.k);
            const btns = el('span', 'slot-btns');
            const re = el('button', 'icon reroll', '🎲');
            re.type = 'button';
            re.setAttribute('aria-label', s.name + '만 다시 뽑기');
            re.title = s.name + '만 다시 뽑기';
            re.addEventListener('click', () => {
                state = rerollSlot(state, s.k, options());
                commit([s.k]);
            });
            const lock = el('button', 'icon lock', '🔓');
            lock.type = 'button';
            lock.setAttribute('aria-label', s.name + ' 고정');
            lock.setAttribute('aria-pressed', 'false');
            lock.title = s.name + ' 고정 (다시 굴려도 유지)';
            lock.addEventListener('click', () => setLock(s.k, !locks[s.k]));
            btns.append(re, lock);
            li.append(label, value, btns);
            slotsEl.append(li);
            slotEls[s.k] = { li, value, lock };
            locks[s.k] = false;
        });
    }

    function flash(node) {
        node.classList.remove('pop');
        void node.offsetWidth;
        node.classList.add('pop');
    }

    function render(changed) {
        pitchEl.textContent = '';
        composeParts(state).forEach(p => {
            if (p.slot) pitchEl.append(el('span', 'w w-' + p.slot, p.text));
            else pitchEl.append(document.createTextNode(p.text));
        });
        flash(pitchEl);
        SLOT_KEYS.forEach(k => {
            const e = entry(k, state.v[k]);
            const v = slotEls[k].value;
            v.textContent = e.text;
            if (!changed || changed.includes(k)) flash(v);
        });
        renderFavButton();
    }

    function setHash(code) {
        try { replaceHash('#' + code); } catch (e) { /* file:// 등 */ }
    }
    function replaceHash(h) {
        if (window.history && window.history.replaceState) window.history.replaceState(null, '', h);
        else window.location.hash = h;
    }

    // 사용자가 새 아이디어를 만들었을 때: 화면 + 주소 + 최근 기록
    function commit(changed) {
        render(changed);
        const code = encode(state);
        setHash(code);
        if (ideaKey(historyList[0] || '') !== ideaKey(code)) {
            historyList = [code].concat(historyList.filter(c => ideaKey(c) !== ideaKey(code))).slice(0, HISTORY_MAX);
            save(KEY_HISTORY, historyList);
            renderLists();
        }
    }

    function rollAll() {
        if (SLOT_KEYS.every(k => locks[k])) toast('모든 칸이 잠겨 있어요 — 문장만 바꿔 볼게요');
        state = generateIdea(state, options());
        commit(SLOT_KEYS.filter(k => !locks[k]));
    }

    // 저장된 코드(공유 링크·기록)로 복원
    function restore(code, quiet) {
        const d = decode(code);
        if (!d) return false;
        setMood(d.mood);
        chaosEl.checked = d.chaos;
        state = completeIdea(d);
        render(null);
        setHash(encode(state));
        if (!quiet && d.valid < SLOT_KEYS.length) toast('일부 항목을 찾을 수 없어 새로 채웠어요');
        return true;
    }

    /* 기록·즐겨찾기 목록 */
    function listItem(code, onRemove) {
        const d = decode(code);
        const li = el('li');
        const btn = el('button', 'item');
        btn.append(el('span', 'item-text', composeText(completePreview(d))));
        btn.type = 'button';
        btn.title = '이 아이디어 다시 보기';
        btn.addEventListener('click', () => { restore(code); pitchEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
        li.append(btn);
        if (onRemove) {
            const x = el('button', 'icon', '✕');
            x.type = 'button';
            x.setAttribute('aria-label', '즐겨찾기에서 삭제');
            x.title = '즐겨찾기에서 삭제';
            x.addEventListener('click', onRemove);
            li.append(x);
        }
        return li;
    }
    // 미리보기는 반복 방지 기록을 건드리지 않도록 빈 칸을 첫 항목으로 채움
    function completePreview(d) {
        const v = {};
        SLOT_KEYS.forEach(k => { v[k] = d.v[k] != null ? d.v[k] : DATA[k].list[0].id; });
        return { v, tpl: d.tpl || 0, pre: d.pre || 0 };
    }
    function renderLists() {
        const h = $('history');
        h.textContent = '';
        historyList.forEach(c => h.append(listItem(c)));
        $('history-empty').hidden = historyList.length > 0;
        $('clear-history').hidden = historyList.length === 0;

        const f = $('favs');
        f.textContent = '';
        favs.forEach(c => f.append(listItem(c, () => {
            favs = favs.filter(x => x !== c);
            save(KEY_FAVS, favs);
            renderLists();
            renderFavButton();
            toast('즐겨찾기에서 뺐어요');
        })));
        $('favs-empty').hidden = favs.length > 0;
    }
    function isFav() { const key = ideaKey(encode(state)); return favs.some(c => ideaKey(c) === key); }
    function renderFavButton() {
        const on = isFav();
        favBtn.setAttribute('aria-pressed', String(on));
        favBtn.textContent = on ? '⭐ 즐겨찾기됨' : '☆ 즐겨찾기';
    }
    function toggleFav() {
        const code = encode(state);
        const key = ideaKey(code);
        if (isFav()) {
            favs = favs.filter(c => ideaKey(c) !== key);
            toast('즐겨찾기에서 뺐어요');
        } else {
            favs = [code].concat(favs).slice(0, FAVS_MAX);
            toast('⭐ 즐겨찾기에 담았어요');
        }
        save(KEY_FAVS, favs);
        renderLists();
        renderFavButton();
    }

    /* 복사·공유 */
    function shareUrl() {
        const base = /^https?:$/.test(location.protocol)
            ? location.origin + location.pathname
            : 'https://wordmaker-eight.vercel.app/';
        return base + '#' + encode(state);
    }
    function legacyCopy(text) {
        const active = document.activeElement;
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '-9999px';
        ta.style.opacity = '0';
        document.body.append(ta);
        let ok = false;
        try {
            ta.select();
            ta.setSelectionRange(0, text.length);
            ok = document.execCommand('copy');
        } catch (e) {
            ok = false;
        }
        ta.remove();
        if (active && active.focus) active.focus();
        return ok;
    }
    async function copyText(text) {
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
                return true;
            }
        } catch (e) { /* 아래 대체 방법으로 */ }
        return legacyCopy(text);
    }
    async function onCopy() {
        const ok = await copyText(fullText(state));
        toast(ok ? '📋 복사했어요!' : '복사에 실패했어요. 문장을 직접 선택해 주세요.');
    }
    async function onShare() {
        const url = shareUrl();
        const text = fullText(state);
        if (navigator.share) {
            try {
                await navigator.share({ title: '게임 아이디어', text, url });
                return;
            } catch (e) {
                if (e && e.name === 'AbortError') return;
            }
        }
        const ok = await copyText(text + '\n' + url);
        toast(ok ? '🔗 링크를 복사했어요!' : '복사에 실패했어요. 주소창의 링크를 써 주세요.');
    }

    /* 키보드: 입력 요소나 버튼에 포커스가 없을 때 Space/Enter로 굴리기 */
    document.addEventListener('keydown', e => {
        if (e.key !== ' ' && e.key !== 'Enter') return;
        if (e.altKey || e.ctrlKey || e.metaKey || e.isComposing || e.repeat) return;
        const t = e.target;
        if (t && t.closest && t.closest('input, textarea, select, button, a[href], [contenteditable], [role="button"], summary')) return;
        e.preventDefault();
        rollAll();
    });

    buildSlots();
    $('roll').addEventListener('click', rollAll);
    $('copy').addEventListener('click', onCopy);
    $('share').addEventListener('click', onShare);
    favBtn.addEventListener('click', toggleFav);
    $('clear-history').addEventListener('click', () => {
        historyList = [];
        save(KEY_HISTORY, historyList);
        renderLists();
        toast('최근 기록을 비웠어요');
    });
    document.querySelectorAll('input[name="mood"]').forEach(r => r.addEventListener('change', savePrefs));
    chaosEl.addEventListener('change', savePrefs);
    window.addEventListener('hashchange', () => {
        const h = location.hash;
        if (h.length > 1 && (!state || h.slice(1) !== encode(state))) restore(h);
    });

    const prefs = load(KEY_PREFS, {});
    if (prefs && typeof prefs === 'object') {
        setMood(prefs.mood);
        chaosEl.checked = prefs.chaos === true;
    }
    renderLists();
    if (!(location.hash.length > 1 && restore(location.hash, true))) {
        state = generateIdea(null, options());
        render(null);
    }

    // 테스트·디버그용
    window.WM = {
        DATA, SLOTS, TEMPLATES, PREFIX, EXCLUDE_PAIRS, MOOD_CONFLICT, RECENT_MAX,
        finalSound, josa, randInt, generateIdea, rerollSlot, composeText, fullText, encode, decode,
        moodAllowed, isExcluded, windowSize, candidates, stats,
        getState: () => state
    };
})();
</script>
</body>
</html>
